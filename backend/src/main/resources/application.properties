# Application
spring.application.name=healthmate-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/healthmate_db
spring.datasource.username=healthmate_user
spring.datasource.password=healthmate_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase Configuration
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT Configuration
# jwt.secret can be a Base64-encoded key or a long raw secret string (>= 32 bytes / 256 bits)
jwt.secret=healthmate-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-security
jwt.expiration=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:aayush.apache@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:nyfxxniqruaduzja}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true


# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.healthmate=DEBUG
