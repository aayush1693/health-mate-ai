databaseChangeLog:
  - changeSet:
      id: 002-create-verification-codes-table
      author: healthmate
      changes:
        - createTable:
            tableName: verification_codes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: verification_codes
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_verification_codes_user
            onDelete: CASCADE
        - createIndex:
            indexName: idx_verification_codes_user_id
            tableName: verification_codes
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_verification_codes_code
            tableName: verification_codes
            columns:
              - column:
                  name: code
